name: Actualizar dólar BCB

on:
  schedule:
    # Hora UTC. Bolivia es UTC-4: 08:30 y 16:30 en Bolivia.
    - cron: "30 12 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer el tipo de cambio del BCB
        run: python scripts/actualizar_dolar.py

      - name: Guardar el cambio en el repositorio
        run: |
          if [ -n "$(git status --porcelain data/dolar.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dolar.csv
            git commit -m "Actualiza tipo de cambio del BCB"
            git push
          else
            echo "Sin cambios que guardar"
          fi